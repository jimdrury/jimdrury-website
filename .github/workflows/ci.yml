name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Authenticate GitHub Packages
        run: |
          {
            echo "@jimdrury:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}"
            echo "//npm.pkg.github.com/:always-auth=true"
          } >> "${HOME}/.npmrc"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  schema-plan:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Authenticate GitHub Packages
        run: |
          {
            echo "@jimdrury:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}"
            echo "//npm.pkg.github.com/:always-auth=true"
          } >> "${HOME}/.npmrc"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Component schema plan
        env:
          STORYBLOK_API_TOKEN: ${{ secrets.STORYBLOK_API_TOKEN }}
          STORYBLOK_SPACE_ID: ${{ secrets.STORYBLOK_SPACE_ID }}
        run: |
          if [ -z "${STORYBLOK_API_TOKEN}" ] || [ -z "${STORYBLOK_SPACE_ID}" ]; then
            echo "Skipping schema:plan because STORYBLOK_API_TOKEN or STORYBLOK_SPACE_ID is not set."
            exit 0
          fi
          pnpm schema:plan
