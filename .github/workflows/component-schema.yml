name: Storyblok component schema

on:
  push:
    branches: [main]
    paths:
      - "schema/**"
      - ".component-schema.yaml"
      - ".github/workflows/component-schema.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Authenticate GitHub Packages
        run: |
          {
            echo "@jimdrury:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}"
            echo "//npm.pkg.github.com/:always-auth=true"
          } >> "${HOME}/.npmrc"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Component schema plan
        id: plan
        env:
          STORYBLOK_API_TOKEN: ${{ secrets.STORYBLOK_API_TOKEN }}
          STORYBLOK_SPACE_ID: ${{ secrets.STORYBLOK_SPACE_ID }}
        run: |
          set -euo pipefail
          set -o pipefail
          pnpm schema:plan 2>&1 | tee plan.log
          if grep -Fq 'No changes.' plan.log; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Component schema apply
        if: success() && steps.plan.outputs.has_changes == 'true'
        env:
          STORYBLOK_API_TOKEN: ${{ secrets.STORYBLOK_API_TOKEN }}
          STORYBLOK_SPACE_ID: ${{ secrets.STORYBLOK_SPACE_ID }}
        run: pnpm schema:apply
